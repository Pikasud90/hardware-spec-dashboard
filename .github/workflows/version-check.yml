name: Version check

# Release artifacts are named from package.json, so a tag that disagrees with
# it ships installers labelled with the wrong version. Catch that before the
# release workflow runs rather than after it has published.
on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG — installers would be misnamed."
            exit 1
          fi
