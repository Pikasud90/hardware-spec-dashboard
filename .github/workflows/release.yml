name: Release

# Builds the standalone desktop applications for macOS and Windows and attaches
# them to a GitHub release. Each platform is built on its own runner — this is
# what avoids needing Wine to cross-compile the Windows target from macOS.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS (Apple Silicon + Intel)
            command: npm run dist:mac
          - os: windows-latest
            name: Windows (x64 + arm64)
            command: npm run dist:win

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: ${{ matrix.command }}
        env:
          # Unsigned open-source builds: stop electron-builder searching for a
          # certificate that does not exist on the runner.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
